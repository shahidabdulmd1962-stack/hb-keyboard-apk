name: Build HB Keyboard

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link of the Orbit Board v1.3.9 arm64 APK (leave empty to try automatically)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0"
          python3 -m pip install --break-system-packages pillow
          for V in 2.10.0 2.9.3; do
            if curl -fsSL -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v$V/apktool_$V.jar"; then echo "apktool $V downloaded"; break; fi
          done
          java -jar apktool.jar --version

      - name: Download original APK
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          B=https://github.com/fahitakrim/Orbit-Board/releases/download
          F=Orbit-Board-v1_3_9-arm64-release.apk
          if [ -n "$APK_URL" ]; then LIST="$APK_URL"; else LIST="$B/v1.3.9/$F $B/1.3.9/$F"; fi
          for U in $LIST; do
            echo "trying $U"
            if curl -fsSL -o orig.apk "$U" && unzip -tq orig.apk > /dev/null 2>&1; then echo "downloaded"; break; fi
            rm -f orig.apk
          done
          if [ ! -f orig.apk ]; then
            echo "ERROR: could not download the APK. Run the workflow again and paste the direct APK link in apk_url."
            exit 1
          fi
          sha256sum orig.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging orig.apk | head -3

      - name: Decode APK
        run: java -Xmx4g -jar apktool.jar d -f orig.apk -o dec

      - name: Patch
        run: python3 patch.py dec

      - name: Build APK
        run: java -Xmx4g -jar apktool.jar b dec -o unsigned.apk

      - name: Signing key (created once, then reused)
        run: |
          if [ ! -f hb.keystore ]; then
            keytool -genkeypair -keystore hb.keystore -alias hb -keyalg RSA -keysize 2048 -validity 10000 -storepass hbkeypass123 -keypass hbkeypass123 -dname "CN=HB Keyboard Personal"
            git config user.name "hb-bot"
            git config user.email "hb-bot@users.noreply.github.com"
            git add hb.keystore
            git commit -m "Add signing key"
            git push || echo "Could not save the key, a new one will be made next time"
          fi

      - name: Align and sign
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks hb.keystore --ks-pass pass:hbkeypass123 --key-pass pass:hbkeypass123 --out HB-Keyboard.apk aligned.apk
          "$BT/apksigner" verify --verbose HB-Keyboard.apk | head -8

      - name: Check result
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          echo "== permissions"
          "$BT/aapt2" dump permissions HB-Keyboard.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "FAIL: INTERNET still present"; exit 1; fi
          echo "== name"
          "$BT/aapt2" dump badging HB-Keyboard.apk | grep -E "^package:|application-label:" | head -3
          echo "== developer leftovers in code (0 is good)"
          unzip -p HB-Keyboard.apk 'classes*.dex' | strings | grep -c -E "fahitakrim|TakrimFahim|itz.takrim" || true
          echo "== patch report"
          cat patch-report.txt
          ls -la HB-Keyboard.apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hb-${{ github.run_number }}" HB-Keyboard.apk --title "HB Keyboard ${{ github.run_number }}" --notes "Based on Orbit Board v1.3.9. No internet permission."
